# Virtual workspace root. This file deliberately has no [project] table:
# the repository itself is not an installable distribution.

[tool.uv.workspace]
members = ["packages/*", "projects/*"]

[tool.uv.dependency-groups]
dev = { requires-python = ">=3.10" }

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "tomli>=2; python_version < '3.11'",
]

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = [
    "_workspace",
    "check_dependencies",
    "check_release_readiness",
    "verify_isolated_install",
]
